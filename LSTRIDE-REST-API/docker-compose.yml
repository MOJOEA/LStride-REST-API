services:
  postgres:
    image: postgres:17
    container_name: lstride-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: lstride
      POSTGRES_PASSWORD: lstride_password
      POSTGRES_DB: lstride

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lstride-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lstride.com
      PGADMIN_DEFAULT_PASSWORD: admin_password

    ports:
      - "5050:80"

    depends_on:
      - postgres

volumes:
  postgres_data: